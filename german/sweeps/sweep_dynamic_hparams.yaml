program: german/sweeps/dynamic_hparam_sweep.py
method: bayes
name: german_dynamic_controller_hparam_search
entity: lshearer2957-self
project: final_results_german
command:
  - ${env}
  - python3
  - ${program}
  - ${args}
metric:
  # DEO + DAO + accuracy-shortfall penalty, averaged over 8 seeds -- see
  # dynamic_hparam_sweep.py's docstring for why this isn't just DEO/DAO alone.
  name: objective
  goal: minimize
parameters:
  # Same span as the fixed-alpha grid (0.05-1.5), so the search covers the
  # same operating range already explored on Adult.
  alpha_init:
    distribution: uniform
    min: 0.01
    max: 1.5
  alpha_lr:
    distribution: uniform
    min: 0.05
    max: 1.0
  ema_alpha:
    distribution: uniform
    min: 0.05
    max: 0.9
  # CORRECTED after the first search: converged per-epoch accuracy on German
  # is ~0.7256 mean with std 0.0162 (measured from Baseline, epochs 15-30) --
  # the floor needs to sit BELOW that noise band, not just below the eventual
  # ceiling, or it fires on routine noise instead of genuine drops (the first
  # search's max=0.76 let it pick 0.7366, which triggered on 84.6% of
  # epochs). max=0.70 sits below the 10th percentile of that distribution.
  acc_floor:
    distribution: uniform
    min: 0.50
    max: 0.70
  w_deo:
    distribution: uniform
    min: 0.1
    max: 5.0
  w_dao:
    distribution: uniform
    min: 0.1
    max: 5.0
  w_acc:
    distribution: uniform
    min: 0.5
    max: 8.0
